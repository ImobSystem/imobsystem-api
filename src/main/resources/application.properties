spring.application.name=imob
server.port=8081

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/imobsystem}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:minhaChaveSecretaSuperSeguraComPeloMenos32Caracteres123}
jwt.expiration=${JWT_EXPIRATION:86400000}
#tempo em milissegundos (que da 24h)
#em produção vou deixar aqui, mas depois tem que ir pra uma variável de ambiente

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always