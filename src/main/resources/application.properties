spring.application.name=imob
server.port=8081

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/imobsystem}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:minhaChaveSecretaSuperSeguraComPeloMenos32Caracteres123}
jwt.expiration=${JWT_EXPIRATION:86400000}
#tempo em milissegundos (que da 24h)
#em produção vou deixar aqui, mas depois tem que ir pra uma variável de ambiente

anthropic.api.key=${ANTHROPIC_API_KEY:sk-default-dev-key}
anthropic.api.model=${ANTHROPIC_MODEL:claude-haiku-4-5}

asaas.api.key=${ASAAS_API_KEY:sk-default-dev-key}
asaas.api.url=${ASAAS_API_URL:https://sandbox.asaas.com/api/v3}
# Token que o Asaas envia no header do webhook (configurado no painel do Asaas).
# Vazio = validação desligada, só pra facilitar o sandbox. EM PRODUÇÃO ISSO TEM QUE ESTAR PREENCHIDO.
asaas.webhook.token=${ASAAS_WEBHOOK_TOKEN:}

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always